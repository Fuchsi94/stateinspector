# Einzige Schreibrechte: Leases fuer Leader Election, nur im eigenen Namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: stateinspector-leader-election
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: stateinspector-leader-election
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: stateinspector-leader-election
subjects:
  - kind: ServiceAccount
    name: stateinspector
