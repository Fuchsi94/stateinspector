name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: extractions/setup-just@v2
      - uses: golangci/golangci-lint-action@v9
      - run: just test
      - run: just test-env
  e2e:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: helm/kind-action@v1
        with: { cluster_name: stateinspector }

      - name: Image bauen und in den Cluster laden
        run: |
          docker build -t stateinspector:ci .
          kind load docker-image stateinspector:ci --name stateinspector

      - name: Postgres, Operator und Demo-Workloads deployen
        run: |
          kubectl apply -f config/base/namespace.yaml
          kubectl apply -f dev/postgres.yaml
          kubectl -n stateinspector rollout status statefulset/postgres --timeout=180s
          kubectl apply -k config/ci
          kubectl apply -f dev/sample-workloads.yaml
          kubectl -n stateinspector rollout status deployment/stateinspector --timeout=180s

      - name: MCP-Port weiterleiten
        run: |
          kubectl -n stateinspector port-forward deployment/stateinspector 8081:8081 &
          for i in $(seq 1 30); do
            nc -z localhost 8081 && exit 0
            sleep 1
          done
          echo "Port-Forward auf 8081 kam nicht hoch" >&2
          exit 1

      - run: go test ./test/e2e/... -tags e2e -v -count=1 -timeout 15m

      - name: Diagnose bei Fehlschlag
        if: failure()
        run: |
          kubectl -n stateinspector get pods -o wide
          kubectl -n stateinspector logs deployment/stateinspector --tail=200 || true
          kubectl -n stateinspector describe deployment/stateinspector || true
