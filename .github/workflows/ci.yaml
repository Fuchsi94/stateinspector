name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: extractions/setup-just@v2
      - uses: golangci/golangci-lint-action@v9
      - run: just test
      - run: just test-env
  e2e:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: extractions/setup-just@v2
      - uses: helm/kind-action@v1
        with: { cluster_name: stateinspector }
      - run: |
          docker build -t stateinspector:ci .
          kind load docker-image stateinspector:ci --name stateinspector
          kubectl apply -f dev/sample-workloads.yaml
          kubectl apply -k config/base --dry-run=client -o yaml >/dev/null
      - run: go test ./test/e2e/... -tags e2e -v -count=1
        env: { E2E_IMAGE: "stateinspector:ci" }
